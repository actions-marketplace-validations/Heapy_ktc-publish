name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: npm test
      - uses: Heapy/setup-ktc@52e4da5405a2dc056dd0c42ac86390c797d12f5d # v1.0.1
        with:
          version: 0.13.0
      - uses: ./
        id: publication
        with:
          working-directory: test/fixtures/jvm
          mode: publish
          repository: mavenLocal
      - name: Verify actual Maven publication
        env:
          PUBLISHED: ${{ steps.publication.outputs.published }}
        run: |
          test "$PUBLISHED" = 'true'
          test -f "$HOME/.m2/repository/io/heapy/actionfixture/publication-test/0.0.0-ci/publication-test-0.0.0-ci.pom"
          test -f "$HOME/.m2/repository/io/heapy/actionfixture/publication-test/0.0.0-ci/publication-test-0.0.0-ci.jar"
  signed-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          kotlin-sha256: '7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd'
          java-version: '25'
          distribution: temurin
      - uses: Heapy/setup-ktc@52e4da5405a2dc056dd0c42ac86390c797d12f5d # v1.0.1
        with:
          version: 0.13.0
      - name: Generate disposable signing key for bundle verification
        env:
          GNUPGHOME: ${{ runner.temp }}/ktc-ci-gnupg
        shell: bash
        run: |
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'Action CI <ci@example.invalid>' rsa2048 sign 1d
          gpg --batch --armor --export-secret-keys 'ci@example.invalid' > "$RUNNER_TEMP/ci-signing-key.asc"
          node <<'JS'
          const fs = require('fs');
          const crypto = require('crypto');
          const key = fs.readFileSync(process.env.RUNNER_TEMP + '/ci-signing-key.asc', 'utf8');
          const delimiter = crypto.randomUUID();
          console.log('::add-mask::' + key.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'));
          fs.appendFileSync(process.env.GITHUB_ENV, 'CI_SIGNING_KEY<<' + delimiter + '\n' + key + '\n' + delimiter + '\n');
          JS
      - uses: ./
        id: bundle
        with:
          working-directory: test/fixtures/central
          signing-key: ${{ env.CI_SIGNING_KEY }}
          artifact-name: signed-central-bundle
      - name: Verify bundle contents and signatures
        shell: bash
        env:
          PUBLISHED: ${{ steps.bundle.outputs.published }}
          GNUPGHOME: ${{ runner.temp }}/ktc-ci-gnupg
        run: |
          test "$PUBLISHED" = 'false'
          kotlinr scripts/verify-bundle.main.kts
